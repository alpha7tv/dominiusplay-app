name: Compilar o aplicativo

on:
  push:
    branches: ['**']
    paths-ignore: ['README.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Aceitar as licenças do Android SDK
        run: yes | sdkmanager --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Chave de assinatura
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KS_KEYPASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KS_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KS_KEYPASS" >> "$GITHUB_ENV"
            echo "Assinando com a chave oficial (secrets)."
          else
            echo "::error::Chave oficial não encontrada nos secrets do repositório. Faltando (vazio = não cadastrado):"
            [ -z "$KS_B64" ] && echo "  - KEYSTORE_BASE64"
            [ -z "$KS_PASS" ] && echo "  - KEYSTORE_PASSWORD"
            [ -z "$KS_ALIAS" ] && echo "  - KEY_ALIAS"
            [ -z "$KS_KEYPASS" ] && echo "  - KEY_PASSWORD"
            echo "Cadastre em Settings > Secrets and variables > Actions > Repository secrets (aba Secrets, não Variables)."
            exit 1
          fi

      - name: Compilar
        run: gradle --no-daemon :app:assembleRelease -PVERSION_CODE=${{ github.run_number }}

      - name: Preparar o APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk dominiusplay.apk
          ls -l dominiusplay.apk
          sha256sum dominiusplay.apk

      - uses: actions/upload-artifact@v4
        with:
          name: dominiusplay-apk
          path: dominiusplay.apk

      - name: Publicar a versão
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Dominius Play 1.0.${{ github.run_number }} (número da versão ${{ github.run_number }})
          body: |
            Aplicativo Dominius Play, versão **1.0.${{ github.run_number }}**.
            No painel (App Dominius → Versões do app), use o **número da versão ${{ github.run_number }}** e o nome **1.0.${{ github.run_number }}**.
          files: dominiusplay.apk
